server:
  port: ${CLAIM_PORT:8097}

spring:
  application:
    name: claim-pro
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  config:
    import: "optional:file:${user.home}/.config/claim-pro/claim.properties"
  datasource:
    url: jdbc:mysql://${CLAIM_MYSQL_HOST:127.0.0.1}:${CLAIM_MYSQL_PORT:3306}/claim?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${CLAIM_MYSQL_USER:claim}
    password: ${CLAIM_MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: never
  data:
    redis:
      host: ${CLAIM_REDIS_HOST:127.0.0.1}
      port: ${CLAIM_REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

claim:
  temporal:
    enabled: ${CLAIM_TEMPORAL_ENABLED:true}
    target: ${CLAIM_TEMPORAL_TARGET:127.0.0.1:7233}
    namespace: default
    task-queue: ${CLAIM_TASK_QUEUE:claim-core}
  mq:
    enabled: ${CLAIM_MQ_ENABLED:true}
    namesrv: ${CLAIM_ROCKETMQ_NAMESRV:127.0.0.1:9876}
  xxljob:
    enabled: ${CLAIM_XXLJOB_ENABLED:true}
    admin-addresses: ${CLAIM_XXLJOB_ADMIN:http://127.0.0.1:8094/xxl-job-admin}
    appname: claim-pro-executor
    # 调度中心在容器内，经 Docker Desktop DNS 回调宿主执行器
    executor-ip: ${CLAIM_XXLJOB_EXECUTOR_IP:host.docker.internal}
    port: ${CLAIM_XXLJOB_PORT:9999}
    access-token: ${CLAIM_XXLJOB_TOKEN:}
    logpath: logs/xxl-job
    logretentiondays: 30
  minio:
    enabled: ${CLAIM_MINIO_ENABLED:true}
    endpoint: ${CLAIM_MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${CLAIM_MINIO_ACCESS_KEY:}
    secret-key: ${CLAIM_MINIO_SECRET_KEY:}
    bucket: claim-evidence
  route:
    fast-limit-cents: 500000
    standard-limit-cents: 5000000
    risk-low: 30
    risk-high: 70
    confidence-min: 0.85
  fraud:
    strategy: ${CLAIM_FRAUD_STRATEGY:rules}
  graph:
    nebula:
      enabled: ${CLAIM_GRAPH_NEBULA:false}
      hosts: ${CLAIM_NEBULA_HOSTS:127.0.0.1:9669}
      space: ${CLAIM_NEBULA_SPACE:claim_graph}
      user: ${CLAIM_NEBULA_USER:root}
      password: ${CLAIM_NEBULA_PASSWORD:nebula}
  canary:
    enabled: ${CLAIM_CANARY_ENABLED:false}
    percent: ${CLAIM_CANARY_PERCENT:0}
    orgs: ${CLAIM_CANARY_ORGS:}
    insurance-types: ${CLAIM_CANARY_TYPES:}
  llm:
    masking: true
    retry-max: 2
    retry-backoff-ms: 500
    circuit-failure-threshold: 5
    circuit-open-ms: 60000
    timeout-ms: 60000
    temperature: 0.2
    max-tokens: 2048
    fallback:
      base-url: ${CLAIM_LLM_BASE_URL:https://api.deepseek.com/v1}
      model: ${CLAIM_LLM_MODEL:deepseek-flash}
      api-key: ${CLAIM_LLM_KEY:}
    routes:
      intake:
        base-url: ${CLAIM_LLM_BASE_URL:https://api.deepseek.com/v1}
        model: ${CLAIM_LLM_FLASH_MODEL:deepseek-flash}
        api-key: ${CLAIM_LLM_KEY:}
      notify:
        base-url: ${CLAIM_LLM_BASE_URL:https://api.deepseek.com/v1}
        model: ${CLAIM_LLM_FLASH_MODEL:deepseek-flash}
        api-key: ${CLAIM_LLM_KEY:}
      coverage-explain:
        base-url: ${CLAIM_LLM_BASE_URL:https://api.deepseek.com/v1}
        model: ${CLAIM_LLM_FLASH_MODEL:deepseek-flash}
        api-key: ${CLAIM_LLM_KEY:}
      assess:
        base-url: ${CLAIM_LLM_BASE_URL:https://api.deepseek.com/v1}
        model: ${CLAIM_LLM_FLASH_MODEL:deepseek-flash}
        api-key: ${CLAIM_LLM_KEY:}
      review:
        base-url: ${CLAIM_LLM_BASE_URL:https://api.deepseek.com/v1}
        model: ${CLAIM_LLM_CHAT_MODEL:deepseek-chat}
        api-key: ${CLAIM_LLM_KEY:}
      fraud-report:
        base-url: ${CLAIM_LLM_BASE_URL:https://api.deepseek.com/v1}
        model: ${CLAIM_LLM_CHAT_MODEL:deepseek-chat}
        api-key: ${CLAIM_LLM_KEY:}
      calc-draft:
        base-url: ${CLAIM_LLM_BASE_URL:https://api.deepseek.com/v1}
        model: ${CLAIM_LLM_FLASH_MODEL:deepseek-flash}
        api-key: ${CLAIM_LLM_KEY:}
      doc-vision:
        base-url: ${CLAIM_VISION_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
        model: ${CLAIM_VISION_MODEL:qwen-vl-max}
        api-key: ${CLAIM_VISION_KEY:}